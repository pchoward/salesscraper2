<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="script-src 'self'; connect-src 'self'; frame-src 'self'; form-action 'none'; object-src 'none'; base-uri 'none'">
<title>ShredDeals development preview</title><link rel="stylesheet" href="navigation.css">
<script type="application/json" id="sportConfig">__CONFIG__</script><script src="navigation.js" defer></script></head>
<body><a class="skip" href="#sportPanel">Skip navigation</a>
<header class="shell-header"><div class="top-row"><button id="brandHome" class="brand" type="button">ShredDeals</button>
<div class="shell-search" role="search"><span class="shell-search-icon" aria-hidden="true"></span><input id="shellSearch" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="shellSuggestions" autocomplete="off" spellcheck="false" placeholder="Search deals, gear, brands or stores…" aria-label="Search current catalog"><div id="shellSuggestions" class="shell-suggestions" role="listbox" aria-label="Search suggestions" hidden></div></div>
<span class="preview-badge">Development prototype</span></div>
<nav class="browse-nav" aria-label="Browse catalog"><div id="sportTabs" role="tablist" aria-label="Sports"></div>
<div id="categoryNavigation" hidden><button id="categoryToggle" type="button" aria-expanded="false" aria-controls="categoryPanel" disabled><span id="categoryLabel">Categories</span><span id="categoryCount" class="category-count"></span><span aria-hidden="true">▾</span></button>
<section id="categoryPanel" class="category-panel" aria-labelledby="categoryTitle" hidden><div class="category-heading"><h2 id="categoryTitle">Shop by category</h2><button id="categoryClose" type="button" aria-label="Close categories">×</button></div><div id="categoryChoices" class="category-choices" role="group" aria-label="Product categories"></div><p id="categoryHint">Counts update with your filters.</p></section></div></nav>
</header>
<main id="sportPanel" role="tabpanel" tabindex="-1"><section id="catalogPanel">
<p id="contextNote" role="status" aria-live="polite"></p>
<iframe id="skateFrame" title="SkateDeals — existing catalog and controls" hidden></iframe>
<section id="comingSoon" hidden><span class="empty-kicker">CATALOG PREVIEW</span><h1 id="emptyTitle"></h1><p class="empty-lead">Coming soon / no catalog yet</p>
<p id="emptyDescription"></p><p class="empty-detail">No products, price histories or alerts are active for this sport. Skate deals stay in Skate.</p>
<button id="backToSkate" type="button">Browse Skate deals</button></section>
<noscript>This prototype needs JavaScript for navigation. The original SkateDeals page remains available separately.</noscript>
</section></main></body></html>
