# Assign OpenCode tasks from anywhere (including the GitHub mobile app):
# open this repository, Actions -> "OpenCode task" -> Run workflow, enter the
# task text, leave the run branch as main, and run.
#
# Each run checks out main, works on a throwaway opencode/<timestamp> branch,
# and opens a DRAFT pull request if (and only if) the task changed files.
# It never commits to main, never merges, and never runs on schedules or
# repo events — only when you dispatch it.
#
# Requires the repository secret OPENCODE_API_KEY (an OpenCode Go API key;
# model: opencode-go/glm-5.3-flash on the Go plan).
name: OpenCode task

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for OpenCode"
        required: true
        type: string

# Serialize tasks; a queued run waits rather than racing a live one.
concurrency:
  group: opencode-task
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  opencode:
    name: Run OpenCode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the selected run branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenCode
        run: npm install --global @opencode/cli

      - name: Create the working branch
        id: branch
        run: |
          branch="opencode/$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Run the task
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          TASK: ${{ inputs.task }}
        run: opencode run --standalone --auto --model opencode-go/glm-5.3-flash "$TASK"

      - name: Push changes and open a draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ inputs.task }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No files changed; OpenCode's reply is in the 'Run the task' log above."
            exit 0
          fi
          git commit -m "OpenCode task: $TASK"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --draft \
            --title "OpenCode: $TASK" \
            --body "Dispatched from a GitHub Actions run. Generated by opencode run
            --standalone --auto --model opencode-go/glm-5.3-flash on a GitHub-hosted runner.
            Review the diff and CI checks here; the workflow never merges."
