name: Pages - Rebuild Without Scraping

# Publishes a UI change without scraping: regenerates sale_items_chart.html
# and history.json from the last scrape's saved data (rebuild_page.py) and
# refreshes the homepage/navigation assets too. No store requests, email or alerts.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - page.py
      - page.js
      - page.css
      - mobile.css
      - previews/**
      - query_state.py
      - sports/**

# The scrape's lock: a rebuild and a scrape never run at the same time.
concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild the page from saved data
        # After a merge, report_inputs.json may not exist until the first
        # scrape that writes it; that run skips instead of failing.
        run: python rebuild_page.py ${{ github.event_name == 'push' && '--skip-if-missing' || '' }}

      - name: Rebuild BMX, Ski and MTB pages from their saved data
        # Each sport's own catalogs/<sport>/ data; a sport not scraped yet is skipped.
        run: |
          for sport in bmx ski mtb; do
            python rebuild_page.py --sport "$sport" --skip-if-missing
          done

      - name: Generate public sport navigation without scraping
        run: python -m previews.publish

      - name: Commit and push the page
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sale_items_chart.html
          git add index.html navigation
          for sport in bmx ski mtb; do
            if [ -e "$sport/sale_items_chart.html" ]; then git add "$sport"; fi
          done
          if [ -e history.json ]; then git add history.json; fi
          git diff --quiet --cached || git commit -m "Rebuild page $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
