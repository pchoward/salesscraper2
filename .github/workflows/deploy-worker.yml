name: Alerts - Deploy Worker

# Deploys the alerts Worker (worker/) from main, the same steps as
# worker/deploy.sh, without a codespace (owner, 2026-11-28). Started by hand
# only: Actions -> "Alerts - Deploy Worker" -> Run workflow.
#   dry_run = true:  writes and shows the config, checks the build, deploys nothing.
#   dry_run = false: applies new D1 migrations, then deploys main.
#
# Needs: secret CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" + D1 Edit),
# variables CLOUDFLARE_ACCOUNT_ID, ALERTS_API_URL and WORKER_D1_ID. Plain
# settings come from worker/write_wrangler_toml.py (override with
# WORKER_<NAME> variables). Worker secrets stay on the Worker; a deploy keeps them.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (deploy nothing)"
        type: boolean
        default: true

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy the Worker from main only."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Worker tests
        working-directory: worker
        run: npm test

      - name: Write wrangler.toml
        env:
          ALERTS_API_URL: ${{ vars.ALERTS_API_URL }}
          WORKER_D1_ID: ${{ vars.WORKER_D1_ID }}
          WORKER_MODE: ${{ vars.WORKER_MODE }}
          WORKER_PUBLIC_ORIGIN: ${{ vars.WORKER_PUBLIC_ORIGIN }}
          WORKER_MANAGE_PAGE_URL: ${{ vars.WORKER_MANAGE_PAGE_URL }}
          WORKER_CONSENT_VERSION: ${{ vars.WORKER_CONSENT_VERSION }}
          WORKER_EMAIL_FROM: ${{ vars.WORKER_EMAIL_FROM }}
          WORKER_MAX_ACTIVE_SUBSCRIBERS: ${{ vars.WORKER_MAX_ACTIVE_SUBSCRIBERS }}
          WORKER_MAX_RULES_PER_SUBSCRIBER: ${{ vars.WORKER_MAX_RULES_PER_SUBSCRIBER }}
          WORKER_DAILY_EMAILS_PER_SUBSCRIBER: ${{ vars.WORKER_DAILY_EMAILS_PER_SUBSCRIBER }}
          WORKER_CATALOG_SEARCH_ENABLED: ${{ vars.WORKER_CATALOG_SEARCH_ENABLED }}
          WORKER_NEWSLETTER_INBOX: ${{ vars.WORKER_NEWSLETTER_INBOX }}
        run: python3 worker/write_wrangler_toml.py

      - name: Preview (dry run)
        if: inputs.dry_run
        working-directory: worker
        run: npx --yes wrangler@4 deploy --dry-run --outdir dist

      - name: Apply D1 migrations
        if: ${{ !inputs.dry_run }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply skatedeals-alerts --remote

      - name: Deploy
        if: ${{ !inputs.dry_run }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          commit="$(git rev-parse --short=12 HEAD)"
          npx --yes wrangler@4 deploy --var "GIT_COMMIT:${commit}"
          echo "Deployed ${commit}."
          curl -fsS --max-time 20 "${{ vars.ALERTS_API_URL }}/v1/health" || true
