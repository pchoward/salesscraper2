name: CI - Pull Request Tests

on:
  # Also test stacked PRs whose base is another feature branch.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Stop obsolete PR runs competing with the current commit. Main runs finish.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: Python and JavaScript regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node.js for JavaScript tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Validate JavaScript syntax
        run: node --check page.js

      - name: Build unified header review artifact
        if: github.event_name == 'pull_request'
        run: python -m previews.unified_header --output-dir "${{ runner.temp }}/unified-header-preview"

      - name: Upload unified header review artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: unified-header-preview
          path: ${{ runner.temp }}/unified-header-preview/
          retention-days: 7
          if-no-files-found: error

      - name: Run alerts Worker tests (local SQLite, mocked network)
        working-directory: worker
        run: node --test test/*.test.js

      - name: Run Python and embedded JavaScript regression tests
        run: python -m unittest discover -s . -p 'test_*.py' -v

  # Build once; reuse this inert site and its prebuilt fixtures in every group.
  preview-build:
    name: Build browser preview
    if: github.event_name == 'pull_request' && vars.PR_PREVIEWS != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install report dependencies
        run: python -m pip install -r requirements.txt
      - name: Build the preview site
        env:
          LABEL: "PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}"
        run: python ci/build_preview.py preview/site --label "${LABEL:0:16}"
      - name: Build isolated browser fixtures (no second catalog rebuild)
        run: |
          mkdir -p "${{ runner.temp }}/browser-fixtures"
          python ci/build_audit_fixtures.py "${{ runner.temp }}/browser-fixtures"
          python ci/build_truck_fixtures.py "${{ runner.temp }}/browser-fixtures"
      - name: Record the PR this preview belongs to
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '{"number": %s, "head_sha": "%s"}\n' "$PR_NUMBER" "$HEAD_SHA" > preview/pr.json
      - uses: actions/upload-artifact@v4
        with:
          name: browser-preview-input
          path: preview/
          include-hidden-files: true
          retention-days: 7
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: browser-fixtures
          path: ${{ runner.temp }}/browser-fixtures/
          retention-days: 7
          compression-level: 1

  browser:
    name: Browser group / ${{ matrix.group }}
    needs: preview-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [navigation, controls, filters, search, audit-wide, audit-phone]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-ubuntu-24.04
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --prefix ci --no-save --no-audit --no-fund playwright@1.56.1
          ci/node_modules/.bin/playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: browser-preview-input
          path: preview
      - uses: actions/download-artifact@v4
        with:
          name: browser-fixtures
          path: ${{ runner.temp }}/browser-fixtures
      - name: Run browser group and record per-suite timings
        run: node ci/run_browser_shard.cjs "${{ matrix.group }}" preview/site review "${{ runner.temp }}/browser-fixtures"
      - name: Keep screenshots and timings even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review-${{ matrix.group }}
          path: review/
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn

  # Preserve the existing required check name and the publisher's pr-preview
  # contract. A missing, cancelled or failing group can never make this green.
  preview:
    name: Preview build and browser checks
    needs: [preview-build, browser]
    if: always() && github.event_name == 'pull_request' && vars.PR_PREVIEWS != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the pristine preview (without test fixtures)
        if: needs.preview-build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: browser-preview-input
          path: preview
      - name: Collect all browser evidence
        if: always() && needs.preview-build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: browser-review-*
          path: review
          merge-multiple: true
      - name: Assemble the existing screenshot/comment artifact
        if: always() && needs.preview-build.result == 'success'
        run: |
          if [ -d review/shots ]; then cp -R review/shots preview/shots; fi
      - name: Upload the preview
        if: always() && needs.preview-build.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview
          path: preview/
          # Preserve the existing main-only publisher whitelist. Live search
          # is off in previews, so the hidden agent profile is not required.
          include-hidden-files: false
          retention-days: 7
          compression-level: 1
          if-no-files-found: error
      - name: Upload combined browser review
        if: always() && needs.preview-build.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: review/
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
      - name: Check every suite and publish timing summary
        if: always()
        run: node ci/summarize_browser_runs.cjs review
      - name: Require the build and every browser group to pass
        if: always()
        env:
          BUILD_RESULT: ${{ needs.preview-build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$BROWSER_RESULT" = success
