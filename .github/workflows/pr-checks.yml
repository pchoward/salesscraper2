name: CI - Pull Request Tests

on:
  # Also test stacked PRs whose base is another feature branch.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python and JavaScript regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node.js for JavaScript tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Validate JavaScript syntax
        run: node --check page.js

      - name: Build unified header review artifact
        if: github.event_name == 'pull_request'
        run: python -m previews.unified_header --output-dir "${{ runner.temp }}/unified-header-preview"

      - name: Upload unified header review artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: unified-header-preview
          path: ${{ runner.temp }}/unified-header-preview/
          retention-days: 7
          if-no-files-found: error

      - name: Run alerts Worker tests (local SQLite, mocked network)
        working-directory: worker
        run: node --test test/*.test.js

      - name: Run Python and embedded JavaScript regression tests
        run: python -m unittest discover -s . -p 'test_*.py' -v

  # Builds a PREVIEW site from the PR's committed data (no scraping, email,
  # alerts or analytics), checks it in Chromium at desktop and phone sizes,
  # and uploads the site and screenshots. Runs with the PR's own code, so it
  # gets no secrets and a read-only token; "CI - Publish PR Preview" (a
  # workflow_run on main's code) posts the results. docs/level2-autonomy.md.
  # Off switch: repository variable PR_PREVIEWS=off.
  preview:
    name: Preview build and browser checks
    if: github.event_name == 'pull_request' && vars.PR_PREVIEWS != 'off'
    # Pinned: Playwright 1.56.1 supports Ubuntu 24.04 but not 26.04 (the
    # current ubuntu-latest). Move both together when upgrading.
    runs-on: ubuntu-24.04
    # Raised from 20 (2026-11-12): the browser checks grew to 18-20 minutes
    # (#270 19.5, #271 18.6) and #272 was cut off at the limit.
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Cache Playwright's browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-ubuntu-24.04

      - name: Install Playwright 1.56.1 and Chromium
        run: |
          npm install --prefix ci --no-save --no-audit --no-fund playwright@1.56.1
          ci/node_modules/.bin/playwright install --with-deps chromium

      - name: Build the preview site
        env:
          # Quoted: in YAML an unquoted " #" starts a comment.
          LABEL: "PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}"
        run: python ci/build_preview.py preview/site --label "${LABEL:0:16}"

      - name: Browser checks and screenshots
        id: smoke
        continue-on-error: true
        run: node ci/smoke.mjs preview/site preview/shots

      - name: Sport/category navigation and live facet counts
        run: node ci/check_category_navigation.cjs preview/site "${{ runner.temp }}/category-navigation-results"

      - name: Sport hover, keyboard and touch menu checks
        run: node ci/check_sport_menus.cjs preview/site "${{ runner.temp }}/category-navigation-results/sport-menus"

      - name: Sidebar disclosure and saved-link browser checks
        run: node ci/check_sidebar.cjs preview/site "${{ runner.temp }}/category-navigation-results/sidebar"

      - name: My stuff persistence and mobile browser checks
        run: node ci/check_my_stuff.cjs preview/site "${{ runner.temp }}/category-navigation-results/my-stuff"

      - name: Variant-aware truck fit and legacy-link browser checks
        # The fixtures must be built outside the checkout (the builder
        # refuses in-tree output), and the check serves the directory
        # it is given.
        run: |
          mkdir -p "${{ runner.temp }}/truck-fit-site"
          python ci/build_truck_fixtures.py "${{ runner.temp }}/truck-fit-site"
          node ci/check_truck_fit.cjs "${{ runner.temp }}/truck-fit-site" "${{ runner.temp }}/category-navigation-results/truck-fit"

      - name: Multi-select store filtering, persistence and history
        run: node ci/check_multi_store.cjs preview/site "${{ runner.temp }}/category-navigation-results/multi-store"

      - name: Full-screen phone filters and desktop preservation
        run: node ci/check_phone_filters.cjs preview/site "${{ runner.temp }}/category-navigation-results/phone-filters"

      - name: Opt-in Shopify live-search browser checks (mocked network)
        run: node ci/check_catalog_search.cjs preview/site "${{ runner.temp }}/category-navigation-results/live-catalog"

      - name: Upload category navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: category-navigation-review
          path: ${{ runner.temp }}/category-navigation-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Header search synchronization regression checks
        run: node ci/check_header_search.cjs preview/site "${{ runner.temp }}/header-search-results"

      - name: Upload header search screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: header-search-review
          path: ${{ runner.temp }}/header-search-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Public Explore demo navigation and mobile checks
        run: node ci/check_explore.cjs preview/site "${{ runner.temp }}/public-explore-results" --public

      - name: Upload public Explore demo screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-explore-demo
          path: ${{ runner.temp }}/public-explore-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Four-sport UI regression checks (saved catalogs and labeled fixtures)
        id: sport_audit
        continue-on-error: true
        run: |
          python ci/build_preview.py "${{ runner.temp }}/four-sport-site" --label "Four-sport UI QA"
          python ci/build_audit_fixtures.py "${{ runner.temp }}/four-sport-site"
          node ci/audit_sports.cjs "${{ runner.temp }}/four-sport-site" "${{ runner.temp }}/four-sport-results"

      - name: Upload four-sport audit evidence (artifact only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-sport-ui-audit
          path: ${{ runner.temp }}/four-sport-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Record the PR this preview belongs to
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '{"number": %s, "head_sha": "%s"}\n' "$PR_NUMBER" "$HEAD_SHA" > preview/pr.json

      - name: Upload the preview
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview
          path: preview/
          retention-days: 7
          if-no-files-found: error

      - name: Fail when a browser check failed
        if: steps.smoke.outcome != 'success' || steps.sport_audit.outcome != 'success'
        run: |
          echo "::error::A browser check failed; see the step above and the PR comment."
          exit 1
