name: CI - Publish PR Preview

# Posts what "CI - Pull Request Tests" built for a pull request: one sticky
# comment with the test result, browser checks and desktop/phone screenshots,
# plus a live preview link once Cloudflare Pages is set up.
#
# Safety (docs/level2-autonomy.md): a workflow_run always runs main's copy of
# this file, checks out main, and never runs the PR's code. The artifact is
# data from the PR's run; ci/check_artifact.py checks it before anything is
# published. Nothing here merges, deploys production, scrapes, or emails.
# Off switch: repository variable PR_PREVIEWS=off.
on:
  workflow_run:
    workflows: ["CI - Pull Request Tests"]
    types: [completed]

permissions: {}

# One publisher at a time: the ci-previews branch is rewritten on each run.
concurrency:
  group: pr-preview-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' && vars.PR_PREVIEWS != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read          # download the PR run's artifact
      contents: write        # the ci-previews screenshots branch only
      pull-requests: write   # the status comment
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Check out main (never the pull request)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download the preview artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pr-preview
          path: incoming
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the pull request and check the artifact
        id: pr
        env:
          DOWNLOADED: ${{ steps.download.outcome }}
        run: |
          set -euo pipefail
          open="$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq ".[] | select(.head.sha == \"$HEAD_SHA\") | .number" | paste -sd, -)"
          if [ -z "$open" ]; then
            echo "No open pull request has head $HEAD_SHA; nothing to publish."
            exit 0
          fi
          number=""
          if [ "$DOWNLOADED" = "success" ] && number="$(python ci/check_artifact.py incoming --head-sha "$HEAD_SHA" --open-prs "$open")"; then
            echo "artifact=ok" >> "$GITHUB_OUTPUT"
          else
            # The preview job failed early, or its artifact was refused: still
            # report on the PR, without screenshots or a preview link.
            number="${open%%,*}"
            echo "artifact=missing" >> "$GITHUB_OUTPUT"
          fi
          head_repo="$(gh api "repos/$REPO/pulls/$number" --jq '.head.repo.full_name')"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "same_repo=$([ "$head_repo" = "$REPO" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish screenshots (ci-previews branch)
        id: shots
        if: steps.pr.outputs.artifact == 'ok'
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
        run: bash ci/publish_screenshots.sh incoming/shots "$NUMBER" "$HEAD_SHA"

      # Optional, off until the owner sets it up (docs/level2-autonomy.md,
      # "Preview hosting"): a Cloudflare Pages project used only for previews.
      # Same-repository PRs only; always a pr-N branch, never production.
      - name: Deploy a preview to Cloudflare Pages
        id: cloudflare
        if: steps.pr.outputs.artifact == 'ok' && steps.pr.outputs.same_repo == 'true' && vars.CF_PAGES_PROJECT != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CF_PAGES_TOKEN or CF_ACCOUNT_ID is not set; no live preview."
            exit 0
          fi
          npx --yes wrangler@4.151.1 pages deploy incoming/site --project-name "$PROJECT" \
            --branch "pr-$NUMBER" --commit-hash "$HEAD_SHA" --commit-dirty=true
          echo "url=https://pr-$NUMBER.$PROJECT.pages.dev/sale_items_chart.html" >> "$GITHUB_OUTPUT"

      - name: Post or update the pull request comment
        if: steps.pr.outputs.number != ''
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_URL: ${{ steps.cloudflare.outputs.url }}
          IMAGES: ${{ steps.shots.outputs.base }}
        run: |
          set -euo pipefail
          python ci/pr_comment.py incoming/shots/summary.json --sha "$HEAD_SHA" --run-url "$RUN_URL" \
            --ci "$CONCLUSION" --preview-url "$PREVIEW_URL" --images-base "$IMAGES" > comment.md
          id="$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- skatedeals-pr-preview -->"))) | .id' | head -n1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/$REPO/issues/$NUMBER/comments" -F body=@comment.md > /dev/null
          fi
          echo "Commented on #$NUMBER."
