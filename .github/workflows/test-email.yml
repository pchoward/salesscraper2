name: Test Email

# Temporary. Sends one clearly labeled test email through the existing SMTP
# settings so delivery can be checked without waiting for a scrape. Delete this
# file once delivery is confirmed.
#
# It does not run the scraper, change or commit any data, or enable the
# notification engine. The only recipients are EMAIL_TO, and EMAIL_FROM must
# be onboarding@resend.dev. Nothing about the SMTP settings or addresses is
# printed; GitHub also masks secret values in logs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send one test email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          REPORT_URL: ${{ secrets.REPORT_URL }}
          # Always a real send, never the dry-run preview.
          EMAIL_DRY_RUN: ''
        run: |
          python - <<'PY'
          import datetime
          import sys

          import notify

          EXPECTED_SENDER = "onboarding@resend.dev"

          config = notify.load_smtp_config()
          if config.missing:
              # Names of unset secrets only, never values.
              print("Test email not sent. Missing secrets: " + ", ".join(config.missing))
              sys.exit(1)
          if config.sender.strip().lower() != EXPECTED_SENDER:
              print(f"Test email not sent. EMAIL_FROM must be {EXPECTED_SENDER}.")
              sys.exit(1)

          # Labeled sample rows from the committed catalog. Read only.
          catalog = notify._load_catalog("previous_data.json")
          digest = notify.build_sample_digest(catalog)
          now = datetime.datetime.now(datetime.timezone.utc)
          banner = (
              "TEST EMAIL from the SkateDeals \"Test Email\" workflow, sent "
              + now.strftime("%Y-%m-%d %H:%M UTC")
              + ". This is not a deal alert. The rows below are [SAMPLE] listings "
              "from the saved catalog with made-up price drops. Nothing was "
              "scraped, changed, or committed."
          )
          message = notify.build_message(digest, config, banner=banner)
          del message["Subject"]
          message["Subject"] = "[TEST] SkateDeals test email"
          message["X-SkateDeals-Test"] = "true"

          try:
              refused = notify._smtp_send(config, message)
          except Exception as exc:
              # The exception type only: server replies can echo addresses.
              print(f"Test email failed: {type(exc).__name__}")
              sys.exit(1)
          if refused:
              print(f"Test email partly refused: {len(refused)} recipient(s) rejected")
              sys.exit(1)
          print(f"Test email sent to {len(config.recipients)} EMAIL_TO recipient(s)")
          PY
