name: Scrape Sale Items

# 17 7 * * * is 3:17 AM EDT, off the top of the hour so GitHub's scheduler
# delay is less likely to skip the run. 43 9 * * * is the backup. The backup
# exits before Chrome, the scrape, and the commit when scrape_health.json
# already records a successful scrape for today's US Eastern date.
on:
  schedule:
    - cron: '17 7 * * *'
    - cron: '43 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Skip the backup cron when today's scrape already succeeded
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python3 schedule.py

      - name: Set up Python
        if: steps.gate.outputs.scrape == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        if: steps.gate.outputs.scrape == 'true'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        if: steps.gate.outputs.scrape == 'true'
        uses: nanasess/setup-chromedriver@v2

      - name: Install dependencies
        if: steps.gate.outputs.scrape == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        if: steps.gate.outputs.scrape == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          REPORT_URL: ${{ secrets.REPORT_URL }}
        run: python scraper.py

      - name: Commit and push changes
        if: steps.gate.outputs.scrape == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sale_items_chart.html previous_data.json price_history.json scrape_health.json site_sales.json
          git diff --quiet --cached || git commit -m "Update sale items $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
