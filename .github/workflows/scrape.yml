name: Scrape Sale Items

# 17 7 * * * is 3:17 AM EDT, off the top of the hour so GitHub's scheduler
# delay is less likely to skip the run. 43 9 * * * is the backup. The backup
# exits before Chrome, the scrape, and the commit when scrape_health.json
# already records a successful scrape for today's US Eastern date.
on:
  schedule:
    - cron: '17 7 * * *'
    - cron: '43 9 * * *'
  workflow_dispatch:
    inputs:
      notification_checkpoint_key:
        description: 'Optional reviewed notification cache key for recovery; normally leave blank'
        required: false
        type: string
      notification_event_id:
        description: 'Optional event hash to resolve after verifying SMTP acceptance externally'
        required: false
        type: string
      notification_resolution:
        description: 'Manual delivery resolution; retry may duplicate an accepted message'
        required: false
        type: choice
        default: none
        options: [none, delivered, retry]

# Serialize state checkpoints and existing catalog commits for this branch.
concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Skip the backup cron when today's scrape already succeeded
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python3 schedule.py

      - name: Set up Python
        if: steps.gate.outputs.scrape == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        if: steps.gate.outputs.scrape == 'true'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        if: steps.gate.outputs.scrape == 'true'
        uses: nanasess/setup-chromedriver@v2

      - name: Install dependencies
        if: steps.gate.outputs.scrape == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore notification checkpoint (not published)
        id: notification_checkpoint
        if: steps.gate.outputs.scrape == 'true' && (vars.NOTIFICATION_ENGINE_ENABLED == '1' || vars.NOTIFICATION_ENGINE_ENABLED == 'true')
        uses: actions/cache/restore@v4
        with:
          path: notification_state.json
          key: ${{ inputs.notification_checkpoint_key || format('notification-v1-{0}-{1}-{2}', github.ref_name, github.run_id, github.run_attempt) }}
          restore-keys: ${{ inputs.notification_checkpoint_key == '' && format('notification-v1-{0}-', github.ref_name) || '' }}

      - name: Reject unavailable explicit recovery checkpoint
        if: steps.gate.outputs.scrape == 'true' && inputs.notification_checkpoint_key != '' && (vars.NOTIFICATION_ENGINE_ENABLED == '1' || vars.NOTIFICATION_ENGINE_ENABLED == 'true') && steps.notification_checkpoint.outputs.cache-hit != 'true'
        run: |
          echo 'Requested notification checkpoint was not found; refusing to initialize or send.'
          exit 1

      - name: Resolve a reviewed notification event
        if: steps.gate.outputs.scrape == 'true' && inputs.notification_resolution != '' && inputs.notification_resolution != 'none' && (vars.NOTIFICATION_ENGINE_ENABLED == '1' || vars.NOTIFICATION_ENGINE_ENABLED == 'true')
        env:
          NOTIFICATION_EVENT_ID: ${{ inputs.notification_event_id }}
          NOTIFICATION_RESOLUTION: ${{ inputs.notification_resolution }}
        run: python -m notification_engine --resolve "$NOTIFICATION_EVENT_ID" --outcome "$NOTIFICATION_RESOLUTION"

      - name: Restore subscriber alert journal (not published)
        if: steps.gate.outputs.scrape == 'true' && (vars.ALERTS_DELIVERY_ENABLED == '1' || vars.ALERTS_DELIVERY_ENABLED == 'true')
        uses: actions/cache/restore@v4
        with:
          path: alerts_state
          key: alerts-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: alerts-v1-${{ github.ref_name }}-

      - name: Run scraper
        if: steps.gate.outputs.scrape == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ADMIN_EMAIL_TO: ${{ secrets.ADMIN_EMAIL_TO }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          REPORT_URL: ${{ secrets.REPORT_URL }}
          NOTIFICATION_ENGINE_ENABLED: ${{ vars.NOTIFICATION_ENGINE_ENABLED }}
          NOTIFICATION_ALLOW_BOOTSTRAP: ${{ vars.NOTIFICATION_ALLOW_BOOTSTRAP }}
          NOTIFICATION_OWNER_ID: ${{ vars.NOTIFICATION_OWNER_ID }}
          NOTIFICATION_RECIPIENT_ID: ${{ vars.NOTIFICATION_RECIPIENT_ID }}
          # Subscriber alerts (docs/alerts-backend.md). Off unless the variable is set.
          ALERTS_DELIVERY_ENABLED: ${{ vars.ALERTS_DELIVERY_ENABLED }}
          ALERTS_ALLOW_BOOTSTRAP: ${{ vars.ALERTS_ALLOW_BOOTSTRAP }}
          ALERTS_API_URL: ${{ vars.ALERTS_API_URL }}
          ALERTS_HMAC_SECRET: ${{ secrets.ALERTS_HMAC_SECRET }}
        run: python scraper.py

      - name: Save subscriber alert journal (not published)
        if: always() && steps.gate.outputs.scrape == 'true' && (vars.ALERTS_DELIVERY_ENABLED == '1' || vars.ALERTS_DELIVERY_ENABLED == 'true') && hashFiles('alerts_state/manifest.json') != ''
        uses: actions/cache/save@v4
        with:
          path: alerts_state
          key: alerts-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save notification checkpoint (not published)
        if: always() && steps.gate.outputs.scrape == 'true' && (vars.NOTIFICATION_ENGINE_ENABLED == '1' || vars.NOTIFICATION_ENGINE_ENABLED == 'true') && hashFiles('notification_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: notification_state.json
          key: notification-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit and push changes
        if: steps.gate.outputs.scrape == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sale_items_chart.html previous_data.json price_history.json scrape_health.json site_sales.json
          git diff --quiet --cached || git commit -m "Update sale items $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
