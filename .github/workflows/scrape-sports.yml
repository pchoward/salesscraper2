name: Scraper - BMX, Ski, MTB

# Daily scrape of the newer ShredDeals sports, published on the live site
# next to Skate (owner's go-live, 2026-11-02). Each sport is scraped on its
# own (python scraper.py --sport <id>) into its own catalogs/<id>/ data and
# <id>/ page; Skate's files and stores are never touched. One email covers
# all three (sports_email.py, using Skate's SMTP secrets and nothing else);
# no subscriber alerts (sports/__init__.py: delivery is Skate-only).
on:
  schedule:
    - cron: '37 21 * * *'
    # Backups (GitHub runs scheduled jobs hours late or drops them): each
    # scrapes only if today's (US Eastern) BMX, Ski and MTB scrapes have not
    # all succeeded.
    - cron: '19 0 * * *'
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      sport:
        description: Which sport to scrape (all = BMX, Ski and MTB)
        type: choice
        default: all
        options: [all, bmx, ski, mtb]

# The scrape's lock, shared with the Skate scrape and the page rebuild: they
# never push at the same time.
concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Start from main as it is now, not as it was when the run was
          # queued: a rebuild that held the lock may have pushed meanwhile.
          ref: ${{ github.ref_name }}

      - name: Skip a backup run when today's scrape already succeeded
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          HEALTH_PATHS: catalogs/bmx/scrape_health.json catalogs/ski/scrape_health.json catalogs/mtb/scrape_health.json
        run: python3 schedule.py

      - name: Set up Python
        if: steps.gate.outputs.scrape == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.scrape == 'true'
        run: pip install -r requirements.txt

      - name: Carry over the preview's history (first live run only)
        if: steps.gate.outputs.scrape == 'true'
        # Before going live, BMX and Ski were scraped into the
        # shreddeals-preview branch. A sport with no data on main yet starts
        # from there, so its first-seen dates and prices carry over.
        run: |
          set -euo pipefail
          if git fetch -q --depth 1 origin shreddeals-preview 2>/dev/null; then
            for sport in bmx ski mtb; do
              if [ ! -e "catalogs/$sport/previous_data.json" ] && git cat-file -e "FETCH_HEAD:_data/catalogs/$sport/previous_data.json" 2>/dev/null; then
                mkdir -p "catalogs/$sport"
                git archive FETCH_HEAD "_data/catalogs/$sport" | tar -x --strip-components=3 -C "catalogs/$sport"
                echo "Started $sport from the preview's data."
              fi
            done
          fi

      - name: Scrape
        if: steps.gate.outputs.scrape == 'true'
        env:
          CHOICE: ${{ inputs.sport || 'all' }}
        # One sport at a time; a sport whose scrape fails keeps its previous
        # data and the others still publish.
        run: |
          # The evening email only covers scrapes from this run.
          echo "SCRAPE_STARTED=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_ENV"
          if [ "$CHOICE" = all ]; then set -- bmx ski mtb; else set -- "$CHOICE"; fi
          for SPORT in "$@"; do
            echo "::group::Scrape $SPORT"
            python scraper.py --sport "$SPORT" || echo "::warning::$SPORT scrape failed; keeping its previous data"
            echo "::endgroup::"
          done

      - name: Email BMX, Ski and MTB deals
        if: steps.gate.outputs.scrape == 'true'
        # One email for the sports scraped above (sports_email.py), with the
        # same SMTP settings and recipients as Skate's. Mail problems are
        # logged and never fail the run.
        env:
          CHOICE: ${{ inputs.sport || 'all' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
        run: |
          if [ "$CHOICE" = all ]; then set -- bmx ski mtb; else set -- "$CHOICE"; fi
          python sports_email.py --since "$SCRAPE_STARTED" "$@" || true

      - name: Update the homepage's sport tabs
        if: steps.gate.outputs.scrape == 'true'
        # A sport gets its tab once its catalog has listings.
        run: python -m previews.publish

      - name: Commit and push
        if: steps.gate.outputs.scrape == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html navigation discover
          for sport in bmx ski mtb; do
            if [ -e "catalogs/$sport" ]; then git add -A -- "catalogs/$sport"; fi
            if [ -e "$sport/sale_items_chart.html" ]; then git add -A -- "$sport"; fi
          done
          git diff --quiet --cached || git commit -m "Update BMX, Ski, MTB deals $(date +'%Y-%m-%d %H:%M')"
          # main can move while this runs (a merge or another publish):
          # re-sync and retry instead of failing the run.
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push && break
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
