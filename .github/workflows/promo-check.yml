name: Promo codes

# Store-wide promo codes ("20% off with code 2026-BFCM-20 at checkout"), which
# change no listed price (promos.py, owner 2026-11-19). Twice a day, shortly
# before the Skate (07:17 UTC) and BMX/Ski/MTB (21:37 UTC) scrapes, every
# store any sport reads is checked once: its homepage and up to three sale
# pages it links to, robots.txt respected. Only promos.json is committed; the
# emails and pages read it. Nothing is emailed from here.
on:
  schedule:
    - cron: '47 6 * * *'
    - cron: '7 21 * * *'
  workflow_dispatch:

# The scrapes' lock: never pushes at the same time as a scrape or rebuild.
concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Store newsletters (docs/newsletter-inbox.md): the only job holding the
  # alerts secret. It downloads stored store mail from the Worker and hands it
  # to the promo job as a file; it reads no store pages. Off until the
  # repository variable NEWSLETTERS_ENABLED is 1.
  newsletters:
    if: vars.NEWSLETTERS_ENABLED == '1' || vars.NEWSLETTERS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch store newsletters
        run: python promos.py --fetch-newsletters
        env:
          NEWSLETTERS_ENABLED: ${{ vars.NEWSLETTERS_ENABLED }}
          ALERTS_API_URL: ${{ vars.ALERTS_API_URL }}
          ALERTS_HMAC_SECRET: ${{ secrets.ALERTS_HMAC_SECRET }}

      - name: Hand the mail to the promo check
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-mail
          path: newsletter_mail.json
          retention-days: 1
          if-no-files-found: ignore

  promos:
    needs: newsletters
    # Runs whether the newsletter job ran, was skipped or failed.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get the newsletter job's mail
        if: needs.newsletters.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: newsletter-mail

      - name: Check stores for promo codes
        run: python promos.py

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add promos.json
          git diff --quiet --cached && exit 0
          git commit -m "Update promo codes $(date +'%Y-%m-%d %H:%M')"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push && break
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
