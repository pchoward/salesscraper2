# Email watchlist for the skate sale digest.
#
# A listing is highlighted on the report when it matches a rule. It is an
# email alert when something below is also true. Rules with none of the
# trigger fields alert when the product is new, back in stock, or the sale
# price drops by any amount. A match that stays at the same price stays
# highlighted on the page and does not send another email by itself.
#
# Fields:
#   id          Short name used in the email. Optional.
#   brand       Brand-wide match. Every word must appear in the product name
#               (Powell Peralta does not match a Powell deck that is not Peralta).
#   name        Individual product. Same word matching. Antihero matches
#               Anti-Hero and Anti Hero. Use this instead of brand for one deck.
#   part        Decks, Wheels, Trucks, or Bearings. Defaults to Decks.
#   min_width   Inches, inclusive. 8.6 matches 8.60 and anything wider.
#               Omitted means no width minimum. A deck with no parseable width
#               does not match a rule that sets min_width.
#   max_width   Inches, inclusive upper bound. Use with min_width for a range
#               (9.5 through 10.0). A deck with no parseable width does not match.
#   width       Exact inches. 8.5 matches 8.50 and does not match 8.25 or 8.75.
#               Combine with brand, part, and max_price for a rule such as
#               any 8.5 inch Anti Hero deck under $50.
#   max_price   Alert when the sale price is under this amount and yesterday
#               it was missing or not under it. The row stays highlighted
#               whenever brand, part, and width match, even above this price.
#   alert_on_drop
#               true: alert on any sale-price drop, including under $2 / 5%.
#   alert_on_low
#               true: also email when a matching product newly hits its
#               all-time low (the same 3-observation / 7-day rule as the page).
#               A product that was already at that low yesterday does not
#               send another email. This does not turn off the other alerts.
#   back_in_stock_width
#               Alert only when this width comes back in stock.
#   note        Shown in the email.
#
# Example (not active): any 8.5 inch Anti Hero deck under $50.
#   - id: antihero-85-under-50
#     brand: Anti Hero
#     part: Decks
#     width: 8.5
#     max_price: 50
#     note: Any 8.5 inch Anti Hero deck under $50
#
# Example (not active): email when a watched deck hits a new all-time low.
#   - id: watched-new-low
#     brand: Heroin
#     part: Decks
#     min_width: 8.6
#     alert_on_low: true
#     note: Email when a watched Heroin deck hits a new all-time low
#
# Example (not active): width range plus the older trigger fields.
#   - id: caster-under-50
#     name: Antihero Caster
#     part: Decks
#     min_width: 8.25
#     max_width: 8.75
#     max_price: 50
#     alert_on_drop: true
#     alert_on_low: true
#     back_in_stock_width: 8.75
#     note: Caster from 8.25 to 8.75 under $50, on any drop, at a new low, or when 8.75 is back

rules:
  - id: black-label-decks
    brand: Black Label
    part: Decks
    min_width: 8.6
    note: Black Label decks 8.6 inches and wider

  - id: powell-peralta-decks
    brand: Powell Peralta
    part: Decks
    min_width: 8.6
    note: Powell Peralta decks 8.6 inches and wider

  - id: heroin-decks
    brand: Heroin
    part: Decks
    min_width: 8.6
    note: Heroin decks 8.6 inches and wider

  - id: antihero-caster
    name: Antihero Caster
    part: Decks
    note: Antihero Caster deck, any width
